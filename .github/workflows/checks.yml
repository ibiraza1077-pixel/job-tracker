name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: job_tracker_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d job_tracker_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/schema.sql
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/job_tracker_test
      - run: npm --prefix backend test
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/job_tracker_test
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
